<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Grupos da Copa</title>

  <style>
    body {
      background-color: #eef3f8;
      font-family: Arial;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .card {
      background-color: white;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 250px;
    }

    h2 {
      text-align: center;
      color: #1e4fa3;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background-color: #1e4fa3;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <h1>Grupos da Copa</h1>
</header>

<div class="container">

  <div id="grupo-a" class="card">
    <h2>Grupo A</h2>
    <ul>
      <li>México</li>
      <li>África do Sul</li>
      <li>Coreia do Sul</li>
      <li>República Tcheca</li>
    </ul>
    <details>
      <summary>Saiba Mais</summary>
      <p>Fatos do grupo A</p>
    </details>
  </div>

  <div id="grupo-b" class="card">
    <h2>Grupo B</h2>
    <ul>
      <li>Canadá</li>
      <li>Suíça</li>
      <li>Catar</li>
      <li>Bósnia</li>
    </ul>
    <details>
      <summary>Saiba Mais</summary>
      <p>Fatos do grupo B</p>
    </details>
  </div>

  <div id="grupo-c" class="card">
    <h2>Grupo C</h2>
    <ul>
      <li>Brasil</li>
      <li>Marrocos</li>
      <li>Haiti</li>
      <li>Escócia</li>
    </ul>
    <details>
      <summary>Saiba Mais</summary>
      <p>Fatos do grupo C</p>
    </details>
  </div>

</div>

<button onclick="proximo()">Próximo</button>

<script src="script3.js"></script>

</body>
</html>
