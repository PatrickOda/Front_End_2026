<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jogador da Copa do Mundo</title>

    <link href="css/bootstrap.css" rel="stylesheet">

    <style>
        body, html {
            height: 100%;
            margin: 0;
        }

        .bg-copa {
            background-image: url('FIFA-World-Cup-26.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            backdrop-filter: blur(5px);
            background-color: rgba(255,255,255,0.9);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="bg-copa">
    <div class="d-flex flex-column align-items-center">

        <!-- AREA DOS CARDS -->
        <div id="Cards" class="d-flex flex-row align-items-center">

            <!-- CARD ORIGINAL -->
            <div class="card" style="width: 22rem; margin:10px;">
                <img src="_vinicius_junior.png" class="card-img-top">

                <div class="card-body">
                    <h5 class="card-title">
                        <span>Vini Jr.</span>
                        <span class="badge text-bg-secondary">9,5</span>
                    </h5>

                    <p class="card-text">
                        <span><strong>Nascimento:</strong> 12/07/2000</span><br>
                        <span><strong>Altura:</strong> 1,76 m</span><br>
                        <span><strong>Posição:</strong> Atacante</span>
                    </p>
                </div>
            </div>

        </div>

        <!-- BOTÃO -->
        <button onclick="add()" class="btn btn-primary" style="margin-top: 15px;">
            Adcionar Novo Jogador
        </button>

    </div>
</div>

<script src="script4.js"></script>

</body>
</html>
