<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>CAIXA LIVRE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        .topo {
            background-color: #ffc107;
            text-align: center;
            font-size: 32px; /* corrigido */
            font-weight: bold;
            border: 4px solid blue;
        }

        .painel {
            background-color: gray;
            padding: 10;
            margin-bottom: 10px;
            border: 3px rgb(39,39,39);
        }
    </style>
</head>

<body class="bg-primary bg-gradient">

    <div id="Alert"><br></div>

    <div class="container mt-3">

        <div class="topo">
            CAIXA LIVRE
        </div>

        <div class="row mt-3">

            <!-- COLUNA ESQUERDA -->
            <div class="col-md-7">
                <h3 class="text-white">
                    <span class="badge text-bg-primary">SUA COMPRA 🛒</span>
                </h3>
                <ul id="lista" class="list-group lista"></ul>
            </div>

            <!-- COLUNA DIREITA -->
            <div class="col-md-5">

                <div class="painel">
                    Total: R$ <span id="Total">0.00</span>
                </div>

                <div class="painel">
                    <label>Código de Barras</label>
                    <input type="text" id="cod" class="form-control">
                </div>

                <div class="painel">
                    <label>Quantidade</label>
                    <input type="text" id="qtd" class="form-control" value="1">
                </div>

                <div class="painel">
                    <label>Quantidade X Valor</label>
                    <div class="alert alert-light" role="alert">
                        <span id="qtdXun">0.00</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
